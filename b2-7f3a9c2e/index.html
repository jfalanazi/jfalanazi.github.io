<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow, noarchive">

<title>صفحة خاصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07110d;color:#e9efe9;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.box{width:min(380px,100%);text-align:center}
.lock{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;border:1px solid rgba(216,178,90,.35);color:#d8b25a}
h1{font-size:22px;font-weight:700}
p{color:#9fb3a5;font-size:14.5px;margin-top:6px}
form{margin-top:22px;display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:15px;direction:ltr;text-align:center;outline:none}
input:focus{border-color:#d8b25a}
button{padding:0 18px;border-radius:12px;border:0;background:#d8b25a;color:#1a1408;font:inherit;font-weight:700;cursor:pointer}
.hint{margin-top:4px;font-size:13px;color:#d8b25a;opacity:.85}
.err{min-height:20px;margin-top:10px;color:#e58f7b;font-size:13.5px}
label.rem{display:inline-flex;gap:6px;align-items:center;margin-top:6px;color:#8aa293;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<main class="box">
  <div class="lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
  <h1>صفحة خاصة</h1>
  <p>أدخل كلمة المرور للمتابعة</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="••••••••" aria-label="كلمة المرور" autofocus>
    <button type="submit">فتح</button>
  </form>
  <label class="rem"><input type="checkbox" id="rem" style="flex:0"> تذكّرني على هذا الجهاز</label>
  <div class="err" id="err"></div>
</main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.v)},key,b64(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const K='fz_pw';
(async()=>{let s=null;try{s=localStorage.getItem(K)||sessionStorage.getItem(K);}catch(e){}
  if(s){try{show(await open_(s));return;}catch(e){try{localStorage.removeItem(K);sessionStorage.removeItem(K);}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent='';
  try{const html=await open_(pw);
    try{(document.getElementById('rem').checked?localStorage:sessionStorage).setItem(K,pw);}catch(_){}
    show(html);
  }catch(x){err.textContent='كلمة المرور غير صحيحة';}
});
</script>
